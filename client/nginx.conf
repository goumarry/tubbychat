# nginx : sert le client Vue ET répartit /api et /ws entre les instances api-1 et api-2.

# Journal SANS secret : $uri ne contient pas la query string (?ticket=...).
log_format sans_secret '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                       'upstream=$upstream_addr rt=$request_time';

# DNS interne de Docker : permet de retrouver api-1 / api-2 même après un redémarrage.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    # Pas de session collante : un WebSocket reste de toute façon sur son instance,
    # et les données partagées (sessions, tickets, historique) sont dans Redis.
    server api-1:3000 resolve max_fails=1 fail_timeout=5s;
    server api-2:3000 resolve max_fails=1 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sans_secret;
    server_tokens off;

    root /usr/share/nginx/html;

    # En-têtes de sécurité du front
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # /metrics n'est lisible que depuis le réseau Docker (Prometheus), jamais depuis l'extérieur.
    location = /metrics { return 404; }

    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
        proxy_read_timeout 75s;    # supérieur à l'intervalle des ping serveur (30 s)
        proxy_send_timeout 75s;
    }

    # --- Production (HTTPS) : décommenter et ajouter « listen 443 ssl; »
    # ssl_certificate     /etc/nginx/certs/tubbychat.crt;
    # ssl_certificate_key /etc/nginx/certs/tubbychat.key;
    # Le client utilisera alors automatiquement wss:// (voir client/src/socket.js).
}
